services:
  - type: web
    name: ytpilot-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: CORS_ORIGIN
        value: http://localhost:3000
      - key: STORAGE_ROOT
        value: /tmp/ytpilot-storage
      - key: TEMP_ROOT
        value: /tmp/ytpilot-storage/tmp
      - key: OUTPUT_ROOT
        value: /tmp/ytpilot-storage/output
      - key: MAX_PARALLEL_JOBS
        value: 1
      - key: POT_PROVIDER_ENABLED
        value: true
      - key: POT_PROVIDER_URL
        value: http://127.0.0.1:4416
      - key: YTDLP_PROXY_URL
        sync: false

  - type: web
    name: ytpilot-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://your-backend-domain.example/api/v1
